# /etc/fail2ban/action.d/push-notify.conf
# fail2ban действие: push известие при блокиране на IP адрес.

[Definition]

actionstart =
actionstop =
actioncheck =

actionban = /usr/local/bin/push-notify -q -l warning -c security "🚫 Блокиран IP: <ip>" "IP адресът <ip> беше блокиран за <bantime> сек. след <failures> неуспешни опита за вход (<name>).
Държава/мрежа: $(whois <ip> 2>/dev/null | grep -iE '^(country|netname|org-name):' | head -3 | tr -s ' ' | tr '\n' ' ')
Последни опити:
$(grep -h '<ip>' /var/log/auth.log 2>/dev/null | tail -3 | cut -c1-160)"

actionunban =

[Init]
name = default
