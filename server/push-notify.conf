# /etc/push-notify/push-notify.conf
# Конфигурация на push-notify и проверките. Файлът се чете от bash – без интервали около "=".

# --- Firebase ---------------------------------------------------------------
# Тайното име на topic-а. Същото име се въвежда в приложението (Настройки).
# Генерирайте с:  echo "srv-$(openssl rand -hex 12)"
FCM_TOPIC="srv-СМЕНЕТЕ-МЕ"

# JSON ключът на service account-а от Firebase (само root да може да го чете!).
SERVICE_ACCOUNT_FILE="/etc/push-notify/service-account.json"

# Име на сървъра, което се показва в приложението.
SERVER_NAME="$(hostname)"

# Едно и също известие с ключ (-k) не се повтаря по-често от това (секунди).
DEDUP_SECONDS=300

# --- raid-health-check.sh (cron, всеки ден в 14:00 – /etc/cron.d/push-notify) ---
# RAID масиви, които се проверяват с mdadm. Празно = без проверка на RAID.
RAID_DEVICES="/dev/md1 /dev/md2 /dev/md3"
# Неоправен проблем с RAID се напомня при всяко пускане (yes/no).
RAID_REMIND="yes"

# Прагове в проценти. Известие идва при преминаване на прага
# и още едно, когато стойността се върне под него.
DISK_WARN=85
DISK_CRIT=95
MEM_WARN=90
# Натоварване (load average за 5 мин.) на ядро. 1.5 = 150% от ядрата.
LOAD_WARN=1.5
# Температура на процесора в °C (ако сензорът е достъпен).
TEMP_WARN=80

# Услуги, които трябва винаги да работят. При спиране – критично известие.
SERVICES="ssh apache2 mysql fail2ban"

# Опитай автоматично да рестартираш спряла услуга (yes/no).
AUTO_RESTART="no"

# Известие за неуспешни systemd услуги (systemctl --failed).
CHECK_FAILED_UNITS="yes"

# Известие, ако е нужен рестарт след обновления (/var/run/reboot-required).
CHECK_REBOOT_REQUIRED="yes"

# Сайтове/адреси, които да се проверяват (HTTP код 2xx/3xx = OK). Празно = без.
# Пример: HTTP_CHECKS="https://example.com http://localhost/health"
HTTP_CHECKS=""

# --- pam-login.sh -----------------------------------------------------------
# IP адреси/мрежи (начало на адреса), от които входът НЕ предизвиква известие.
# Пример: LOGIN_IGNORE_IPS="192.168.1. 10.0.0.5"
LOGIN_IGNORE_IPS=""

# Известие и при използване на sudo (yes/no) – изисква ред в /etc/pam.d/sudo.
NOTIFY_SUDO="yes"

# --- auth-watch.sh (грешна парола за sudo / su) -----------------------------
# Първият грешен опит идва веднага; следващите в този прозорец (секунди)
# идват като едно обобщение „×N“.
AUTH_WATCH_WINDOW=120
AUTH_WATCH_SERVICES="sudo sudo-i su su-l"

# --- Потребители без root права ---------------------------------------------
# Потребители, които могат да пускат push-notify през sudo без парола
# (cron задачи и PHP на обикновен потребител). install.sh генерира
# /etc/sudoers.d/push-notify. Пример: SUDO_USERS="www-data georgiev1354"
SUDO_USERS="georgiev1354"
